name: Lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify workflow lockfile
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
