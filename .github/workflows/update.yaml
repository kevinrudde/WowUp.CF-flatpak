name: Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            manifest: io.wowup.WowUp.yml
          - channel: beta
            manifest: io.wowup.WowUp.beta.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Update manifest
        id: update
        run: scripts/update-manifest.sh "$CHANNEL" "$MANIFEST"
        env:
          CHANNEL: ${{ matrix.channel }}
          MANIFEST: ${{ matrix.manifest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push to main
        if: steps.update.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update $CHANNEL to $VERSION"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run deploy.yaml --ref "$GITHUB_REF_NAME"
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.update.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
